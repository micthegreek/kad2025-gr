<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- ΑΑΔΕ badge -->
  <rect x="60" y="50" width="160" height="36" rx="18" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="140" y="73" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#22c55e" text-anchor="middle" letter-spacing="1">ΑΑΔΕ Α.1113/2026</text>

  <!-- Main announcement card -->
  <rect x="60" y="110" width="760" height="390" rx="16" fill="url(#card)" opacity="0.9"/>
  <rect x="60" y="110" width="4" height="390" rx="2" fill="url(#accent)"/>

  <!-- "ΠΑΡΑΤΑΣΗ" tag -->
  <rect x="88" y="138" width="140" height="32" rx="8" fill="#22c55e"/>
  <text x="158" y="159" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">ΠΑΡΑΤΑΣΗ</text>

  <!-- Main headline -->
  <text x="88" y="220" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff">Νέα Προθεσμία</text>
  <text x="88" y="275" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#22c55e">Επικαιροποίησης ΚΑΔ</text>

  <!-- Old date (strikethrough area) -->
  <text x="88" y="335" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">Παλιά προθεσμία:</text>
  <text x="295" y="335" font-family="Arial, sans-serif" font-size="22" fill="#ef4444" text-decoration="line-through">1η Ιουνίου 2026</text>
  <line x1="293" y1="328" x2="500" y2="328" stroke="#ef4444" stroke-width="2"/>

  <!-- New date (highlighted) -->
  <rect x="88" y="355" width="620" height="64" rx="10" fill="#22c55e" opacity="0.12"/>
  <rect x="88" y="355" width="620" height="64" rx="10" stroke="#22c55e" stroke-width="1.5" fill="none"/>
  <text x="120" y="396" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">Νέα προθεσμία:</text>
  <text x="310" y="396" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#22c55e">30 Οκτωβρίου 2026</text>

  <!-- Subtitle -->
  <text x="88" y="460" font-family="Arial, sans-serif" font-size="17" fill="#94a3b8">Χωρίς πρόστιμο, εφόσον δεν έχει υποβληθεί μεταβολή</text>
  <text x="88" y="485" font-family="Arial, sans-serif" font-size="17" fill="#94a3b8">ΚΑΔ μετά την 1η Μαρτίου 2026.</text>

  <!-- Right side - Calendar visual -->
  <rect x="880" y="110" width="260" height="390" rx="16" fill="#1e293b" opacity="0.8"/>

  <!-- Calendar header -->
  <rect x="880" y="110" width="260" height="70" rx="16" fill="#22c55e"/>
  <rect x="880" y="160" width="260" height="20" fill="#22c55e"/>
  <text x="1010" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">ΟΚΤΩΒΡΙΟΣ</text>
  <text x="1010" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#dcfce7" text-anchor="middle">2026</text>

  <!-- Calendar days header -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="600">
    <text x="911" y="215">ΔΕ</text>
    <text x="948" y="215">ΤΡ</text>
    <text x="985" y="215">ΤΕ</text>
    <text x="1022" y="215">ΠΕ</text>
    <text x="1059" y="215">ΠΑ</text>
    <text x="1096" y="215">ΣΑ</text>
    <text x="1133" y="215">ΚΥ</text>
  </g>

  <!-- Calendar grid - October 2026 -->
  <!-- Row 1: 1,2,3,4 -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    <text x="1059" y="248">1</text>
    <text x="1096" y="248">2</text>
    <text x="1133" y="248">3</text>
    <!-- Row 2: 5-11 -->
    <text x="911" y="284">5</text>
    <text x="948" y="284">6</text>
    <text x="985" y="284">7</text>
    <text x="1022" y="284">8</text>
    <text x="1059" y="284">9</text>
    <text x="1096" y="284">10</text>
    <text x="1133" y="284">11</text>
    <!-- Row 3: 12-18 -->
    <text x="911" y="320">12</text>
    <text x="948" y="320">13</text>
    <text x="985" y="320">14</text>
    <text x="1022" y="320">15</text>
    <text x="1059" y="320">16</text>
    <text x="1096" y="320">17</text>
    <text x="1133" y="320">18</text>
    <!-- Row 4: 19-25 -->
    <text x="911" y="356">19</text>
    <text x="948" y="356">20</text>
    <text x="985" y="356">21</text>
    <text x="1022" y="356">22</text>
    <text x="1059" y="356">23</text>
    <text x="1096" y="356">24</text>
    <text x="1133" y="356">25</text>
    <!-- Row 5: 26-31 -->
    <text x="911" y="392">26</text>
    <text x="948" y="392">27</text>
    <text x="985" y="392">28</text>
    <text x="1022" y="392">29</text>
  </g>

  <!-- Highlighted 30 -->
  <circle cx="1096" cy="384" r="22" fill="#22c55e"/>
  <text x="1096" y="391" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">30</text>

  <g font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    <text x="1133" y="392">31</text>
  </g>

  <!-- Bottom label on calendar -->
  <text x="1010" y="448" font-family="Arial, sans-serif" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="600">ΚΑΤΑΛΗΚΤΙΚΗ</text>
  <text x="1010" y="466" font-family="Arial, sans-serif" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="600">ΗΜΕΡΟΜΗΝΙΑ</text>

  <!-- Source tag -->
  <text x="1010" y="490" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Πηγή: ΑΑΔΕ Α.1113/2026</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#0f172a"/>
  <text x="60" y="616" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#22c55e">kad2025.gr</text>
  <text x="200" y="616" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Αντιστοίχιση &amp; Επικαιροποίηση ΚΑΔ 2025</text>
  <text x="1140" y="616" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="end">Ιούνιος 2026</text>
</svg>
